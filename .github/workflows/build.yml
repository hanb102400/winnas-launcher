# WinNas Launcher 多平台打包 CI
#
# 触发方式：
#   - workflow_dispatch：手动触发（只构建 + 上传 workflow artifacts）
#   - push v* tag：构建并把各平台产物合并到一个 draft GitHub Release
#
# 产物矩阵：
#   Windows x64   -> NSIS 安装版 + 便携版 zip（windows-latest）
#   Linux x86_64  -> AppImage + deb（ubuntu-22.04，兼容基线，glibc 较老可跑旧发行版）
#   Arch Linux    -> AppImage（container: archlinux，最新 glibc，给 Arch/新系统用户）
#   macOS arm64   -> dmg（macos-latest，Apple Silicon）
#
# 注：GitHub 无官方 Arch runner，用 archlinux:latest 容器构建。

name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 标准三平台（Windows / Ubuntu 22.04 / macOS arm64） ----------
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            platform: windows-latest
            artifact: winnas-windows
          - name: linux-ubuntu
            platform: ubuntu-22.04
            artifact: winnas-linux
          - name: macos
            platform: macos-latest
            artifact: winnas-macos
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Linux 系统依赖（webkit2gtk-4.1 等；仅 ubuntu job 需要）
      - name: Install Linux dependencies
        if: matrix.name == 'linux-ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build (tauri)
        run: npm run tauri build

      # Windows：额外组装绿色便携版 zip（exe + portable.flag）
      - name: Assemble portable zip (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType File -Force portable.flag | Out-Null
          Compress-Archive -Path 'src-tauri/target/release/winnas-launcher.exe','portable.flag' `
            -DestinationPath 'WinNas-Launcher-portable.zip' -Force

      - name: Upload artifacts (Windows)
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/winnas-launcher.exe
            WinNas-Launcher-portable.zip

      - name: Upload artifacts (Linux)
        if: matrix.name == 'linux-ubuntu'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      - name: Upload artifacts (macOS)
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

  # ---------- Arch Linux（container 构建，产物 AppImage） ----------
  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Update & install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git \
            webkit2gtk-4.1 gtk3 libappindicator-gtk3 librsvg libsoup3 \
            openssl file nodejs npm rust
      - uses: actions/checkout@v4
      - name: Install frontend dependencies
        run: npm ci
      - name: Build (tauri)
        run: npm run tauri build
      - name: Upload artifacts (Arch)
        uses: actions/upload-artifact@v4
        with:
          name: winnas-arch
          if-no-files-found: error
          path: src-tauri/target/release/bundle/appimage/*.AppImage

  # ---------- 打 tag 时：汇总所有产物，创建 draft Release ----------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 每个 artifact 保留独立子目录（ubuntu 与 arch 的 AppImage 同名 *_amd64.AppImage，
      # merge-multiple 会冲突；分开下载后由 files 递归收集）
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**
